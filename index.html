<!DOCTYPE html>
<html>
    <head>
        <title>LOPES ANTUNES ORÁCULO</title>
        <link rel="stylesheet" href="content/stylesheets/global.css" />
    </head>
    <body>
		<!---NOVO-->
		<div id="data-hora">

			<div class="clock">
				<div class="digit" id="h1"></div>
				<div class="digit" id="h2"></div>
		
				<div class="sep blink">
					<div>
						<div class="dot"></div>
					</div>
					<div>
						<div class="dot"></div>
					</div>
				</div>
			
				<div class="digit" id="m1"></div>
				<div class="digit" id="m2"></div>
			
				<div class="sep blink" style="display: none;">
					<div>
						<div class="dot"></div>
					</div>
					<div>
						<div class="dot"></div>
					</div>
				</div>
			
				<div id="s1" class="digit hidden"></div>
				<div id="s2" class="digit hidden"></div>
			</div>

			<h1 id="data-hora-dia-semana"></h1>
			<h1 id="data-hora-data"></h1>
		
		</div>
        <script src="content/scripts/global.js"></script>
    </body>
</html>
